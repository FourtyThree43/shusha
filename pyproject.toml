[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shusha"
dynamic = ["version"]
description = "Shusha — Multi-backend download acquisition and orchestration platform"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
keywords = [
  "aria2", "aria2c", "download-manager", "downloader", "aria2-gui", "python",
  "tkinter", "RPC", "xmlrpc", "aria2-webui"
]
authors = [
  { name = "FourtyThree43", email = "shaqmwa@outlook.com" },
  { name = "Kemboiray", email = "kemboiray@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "ttkbootstrap>=1.10.1",
  "platformdirs>=4.1.0",
  "pillow>=10.0.0",
  "textual>=8.2.8",
]

[project.urls]
Documentation = "https://github.com/FourtyThree43/shusha#readme"
Issues = "https://github.com/FourtyThree43/shusha/issues"
Source = "https://github.com/FourtyThree43/shusha"

[project.scripts]
shusha = "shusha.interfaces.cli.main:main"
shusha-tui = "shusha.interfaces.tui.app:run_tui"
shusha-host = "shusha.acquisition.browser.bridge:main"

[project.gui-scripts]
shusha-gui = "shusha.main:run_gui"

[tool.hatch.version]
path = "src/shusha/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/shusha"]

[dependency-groups]
dev = [
  "coverage[toml]>=7.6.1",
  "pytest>=8.3.5",
  "pytest-cov>=5.0.0",
  "ruff>=0.16.3",
  "ty>=0.0.72",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "archive"]

[tool.coverage.run]
source_pkgs = ["shusha"]
branch = true
parallel = true
omit = [
  "src/shusha/__about__.py",
]

[tool.coverage.paths]
shusha = ["src/shusha", "*/shusha/src/shusha"]
tests = ["tests", "*/shusha/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = [
  "archive",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "RUF",
]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF012"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.src]
exclude = [
  "archive/**",
]
