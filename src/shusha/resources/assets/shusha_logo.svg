<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shusha-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="512" height="512" rx="110" fill="#0f172a" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#shusha-grad)" stroke-width="4" opacity="0.4" />

  <!-- Speed Stream Lines -->
  <g stroke="url(#shusha-grad)" stroke-width="6" stroke-linecap="round" opacity="0.6">
    <line x1="90" y1="180" x2="150" y2="180" />
    <line x1="70" y1="256" x2="160" y2="256" />
    <line x1="90" y1="332" x2="140" y2="332" />
  </g>

  <!-- Downward Turbo Rocket Arrow -->
  <g filter="url(#shadow)">
    <!-- Primary Arrow Body -->
    <path d="M256 90 L370 240 L300 240 L300 370 L212 370 L212 240 L142 240 Z" fill="url(#shusha-grad)" />

    <!-- Lightning Bolt Overlay -->
    <path d="M268 140 L230 245 L272 245 L244 340 L302 230 L260 230 Z" fill="url(#bolt-grad)" opacity="0.95" />
  </g>

  <!-- Bottom Data Waves / Speed Nodes -->
  <g fill="#38bdf8">
    <circle cx="212" cy="410" r="8" />
    <circle cx="256" cy="420" r="10" />
    <circle cx="300" cy="410" r="8" />
  </g>
</svg>
